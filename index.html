<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mehrab | Personal Site</title>

<style>
*{
    box-sizing:border-box;
    font-family:tahoma,Arial;
}

body{
    margin:0;
    background:#050505;
    color:white;
}

header{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    background:
    radial-gradient(circle,#0f6 0%,#050505 45%);
}

.card{
    background:#ffffff10;
    backdrop-filter:blur(10px);
    padding:40px;
    border-radius:25px;
    width:90%;
    max-width:600px;
    box-shadow:0 0 40px #00ff99;
    animation:show 1.5s;
}

h1{
    font-size:55px;
    margin:10px;
    color:#00ff99;
}

p{
    font-size:22px;
}

.btn{
    display:inline-block;
    margin-top:25px;
    padding:15px 40px;
    border-radius:30px;
    background:#00ff99;
    color:#000;
    text-decoration:none;
    font-size:20px;
}

section{
    padding:50px 20px;
    text-align:center;


.box{
    display:inline-block;
    background:#111;
    padding:25px;
    margin:10px;
    border-radius:20px;
    width:250px;
    box-shadow:0 0 20px #222;
}
.
@keyframes show{
from{
opacity:0;
transform:translateY(50px);
}
to{
opacity:1;
transform:translateY(0);
}
}
</style>

</head>

<body>

<header>
<div class="card">
<h1>مهراب 👑</h1>
<p>Welcome To My Website</p>
<p>🎮 Gaming | 💪 Fitness | 💻 Technology</p>
<a class="btn" href="#about">ورود</a>
</div>
</header>

<section id="about">

<div class="box">
<h2>🎮 گیم</h2>
<p>علاقه‌مند به بازی و تکنولوژی</p>
</div>

<div class="box">
<h2>💪 ورزش</h2>
<p>بدنسازی و پیشرفت روزانه</p>
</div>

<div class="box">
<h2>🚀 هدف</h2>
<p>ساختن چیزهای جدید</p>
</div>

</section>

</body>
</html>
