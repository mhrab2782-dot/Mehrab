<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mehrab Gamer</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    overflow:hidden;
    font-family:Arial,sans-serif;
    color:white;
    background:linear-gradient(135deg,#0066ff,#8a00ff);
}


/* Loading */

#loading{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
}

.name{
    font-size:55px;
    font-weight:bold;
    cursor:pointer;
    animation:updown 1s infinite alternate;
    text-shadow:0 0 25px white;
}

@keyframes updown{
    from{transform:translateY(0);}
    to{transform:translateY(-25px);}
}

.job{
    margin:15px;
    font-size:20px;
}

.loader{
    width:280px;
    height:20px;
    background:#ffffff40;
    border-radius:20px;
    overflow:hidden;
}

.bar{
    height:100%;
    width:0%;
    background:white;
}

#percent{
    margin-top:10px;
}


/* سایت اصلی */

#site{
    display:none;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

    width:85%;
    max-width:400px;

    padding:35px;

    text-align:center;

    background:#ffffff22;

    border-radius:30px;
